<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<title>Stijn</title>
<style>
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #1e1e2f, #3a3a5c);
    font-family: sans-serif;
  }
  h1 {
    color: white;
    font-size: 4rem;
    text-shadow: 0 0 20px #7f5af0;
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.05); }
  }
</style>
</head>
<body>
  <h1>👋 Stijn</h1>
</body>
</html>
